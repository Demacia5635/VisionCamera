[project]
name = "VisionCamera"
version = "1.0.0"
description = "Overhead Limelight camera pose/velocity ground truth for Demacia 2027"
authors = [{name = "Udi Kislev", email = "udi.kislev@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "numpy",
    "Pillow",
]
dynamic = ["optional-dependencies"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
optional-dependencies = {dev = {file = ["dev-requirements.txt"]}} # add packages for development in the dev-requirements.txt file

[project.scripts]
visioncamera-record = "VisionCamera.VideoWriter:main"
visioncamera-view = "VisionCamera.viewCaptures:main"
visioncamera-calibrate = "VisionCamera.calibration_tool:main"
visioncamera-analyze = "VisionCamera.pose_analyzer:main"




